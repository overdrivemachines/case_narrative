name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Check Bun version matches mise.toml
        run: |
          expected_bun="$(ruby -e 'version = File.read("mise.toml")[/^\s*bun\s*=\s*"([^"]+)"/, 1]; abort "Bun version is missing from mise.toml" unless version; print version')"
          actual_bun="$(bun --version)"
          if [[ "$actual_bun" != "$expected_bun" ]]; then
            echo "Bun version mismatch: mise.toml specifies $expected_bun, CI installed $actual_bun"
            exit 1
          fi

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('mise.toml', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      - name: Lint JavaScript
        run: bun run lint

      - name: Lint CSS and SCSS
        run: bun run lint:css
