server {
  # This file is located at /etc/nginx/sites-enabled/case_narrative.conf
  server_name casenarrative.com;

  # Tell Nginx and Passenger where your app's 'public' directory is
  root /var/www/case_narrative/code/public;

  # Logs
  access_log /var/log/nginx/case_narrative.access.log;
  error_log /var/log/nginx/case_narrative.error.log info;

  # Turn on Passenger
  passenger_enabled on;
  passenger_app_root /var/www/case_narrative/code;
  passenger_ruby /home/deploy/.local/share/mise/installs/ruby/4.0.9/bin/ruby;
  passenger_app_env production;
  passenger_friendly_error_pages on;

  # Basic security headers for a production app
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /cable {
    passenger_app_group_name case_narrative_websocket;
    passenger_force_max_concurrent_requests_per_process 0;
  }

  # Allow uploads up to 100MB in size
  client_max_body_size 100m;

  location ~ ^/(assets|packs) {
    expires max;
    gzip_static on;
    access_log off;
  }

  listen [::]:443 ssl ipv6only=on; # managed by Certbot
  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/casenarrative.com/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/casenarrative.com/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
  if ($host = casenarrative.com) {
    return 301 https://$host$request_uri;
  } # managed by Certbot

  listen 80;
  listen [::]:80;
  server_name casenarrative.com;
  return 404; # managed by Certbot
}
