---
EnableDefaultLinters: true

glob: "app/views/**/*.{html,text,json}{+*,}.erb"

linters:
  DeprecatedClasses:
    enabled: true
    # Add project-specific deprecated class patterns as the CSS policy evolves.
    rule_set: []

  ErbSafety:
    enabled: true

  PartialInstanceVariable:
    enabled: true

  Rubocop:
    enabled: true
    rubocop_config:
      inherit_from:
        - .rubocop.yml
      Layout/InitialIndentation:
        Enabled: false
      Layout/LineLength:
        Enabled: false
      Layout/TrailingEmptyLines:
        Enabled: false
      Layout/TrailingWhitespace:
        Enabled: false
      Naming/FileName:
        Enabled: false
      Style/FrozenStringLiteralComment:
        Enabled: false
      Lint/UselessAssignment:
        Enabled: false
      Rails/OutputSafety:
        Enabled: false

  RequireScriptNonce:
    enabled: true

  StrictLocals:
    enabled: true
