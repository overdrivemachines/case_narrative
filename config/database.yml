default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: case_narrative_development
  host: localhost
  port: 5432
  username: postgres
  password: <%= Rails.application.credentials.dig(:database, :development, :password) %>

test:
  <<: *default
  database: case_narrative_test
  host: localhost
  port: 5432
  username: postgres
  password: <%= Rails.application.credentials.dig(:database, :test, :password) %>

production:
  # PostgreSQL role used by this app is separate from the Linux `deploy` account and
  # should not be shared with other apps or replaced with the `postgres` superuser.
  # Dedicated role `case_narrative` is the owner of this app's production databases.
  primary: &primary_production
    <<: *default
    database: case_narrative_production
    host: localhost
    port: 5432
    username: case_narrative
    password: <%= Rails.application.credentials.dig(:database, :production, :password) %>
  cache:
    <<: *primary_production
    database: case_narrative_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: case_narrative_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: case_narrative_production_cable
    migrations_paths: db/cable_migrate
