default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  # Local development PostgreSQL runs in the `postgres` service in compose.yaml.
  # Connect through the published host port (5432 by default).
  database: case_narrative_development
  host: localhost
  port: 5432
  username: postgres
  password: <%= Rails.application.credentials.dig(:database, :development, :password) %>

test:
  <<: *default
  database: case_narrative_test
  host: localhost
  port: 5432
  username: postgres
  password: <%= Rails.application.credentials.dig(:database, :test, :password) %>

production:
  # Production uses PostgreSQL installed on the VPS (not the development Docker
  # container). The PostgreSQL login role is `case_narrative`, separate from the
  # Linux `deploy` account. It owns these databases:
  #   primary: case_narrative_production
  #   cache:   case_narrative_production_cache
  #   queue:   case_narrative_production_queue
  #   cable:   case_narrative_production_cable
  primary: &primary_production
    <<: *default
    database: case_narrative_production
    host: localhost
    port: 5432
    username: case_narrative
    password: <%= Rails.application.credentials.dig(:database, :production, :password) %>
  cache:
    <<: *primary_production
    database: case_narrative_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: case_narrative_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: case_narrative_production_cable
    migrations_paths: db/cable_migrate
