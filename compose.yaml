services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: case_narrative_development
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d case_narrative_development"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
